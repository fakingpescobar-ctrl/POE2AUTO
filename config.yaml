game:
  window_title: Path of Exile 2
capture:
  backend: dxcam
vision:
  marker_rgb:
  - 235
  - 0
  - 185
  extra_colors: []
  hue_tolerance: 8
  sat_min: 200
  val_min: 120
  min_blob_area: 200
  close_px: 3
loot:
  pickup_radius_px: 400
  radius_frac: 0          # 0 = pickup_radius_px; >0 = min(h,w)*frac (напр. 0.21 ≈ 400px на 1080p)
  center_offset_xy:
  - 0
  - -40
  cooldown_ms: 100
  pickup_hold_ms: 60
  pickup_button: a
  priority_mode: distance   # size (по умолчанию, крупные первые) | distance (ближе к центру)
hp:
  enabled: true
  orb:
    cx: 0.0732
    cy: 0.8712
    r: 0.0799
  threshold: 0.88
  cooldown_ms: 333
  flask_button: left_trigger
  flask_hold_ms: 120
  fill_mode: linear
  red_sat_min: 24
  red_val_min: 52
  row_fill_frac: 0.28
  strip_frac: 0.2
  gap_tol_frac: 0.1
  rune_frac: 0.38
  bottom_trim_frac: 0.05
  full_ratio: 0.78
  valid_val: 45
  fallback_red_frac_min: 0.04
  confirm_frames: 1
  tripwire: true
hp_num:
  # Чтение HP из цифр HUD (current/max) — основной источник, орб как fallback.
  # Включается только когда откалиброваны все шаблоны (calibrate_hp_digits.py).
  enabled: true
  auto_locate: true     # на старте сам найти строку HP и орб на экране (портативность
                        # между разрешениями/UI Scale; не нашёл сразу — ищет в фоне)
  roi: {x1: 0.066, y1: 0.700, x2: 0.137, y2: 0.735}   # зона строки «Здоровье» (fallback/стартовая)
  bin_thr: 130          # порог бинаризации (белый текст)
  match_min: 0.55       # мин. совпадение с шаблоном глифа
  min_glyph_h: 10       # мин. высота глифа (px) — отсев шума
  max_hp: 1371          # стартовый max HP (только отсев мусора; дальше подстраивается сам при смене шмота)
  menu_grace_s: 0.5     # цифры нет дольше этого = меню/перекрыт HUD → не пьём (орб подстрахует только в пределах окна)
auto_attack:
  # авто-атака: держим R1, пока в радиусе есть живой враждебный моб.
  # use_memory=reader — встроенный C# ридер (ОДИН процесс, pythonnet → PoE2ReaderLib.dll).
  #   НЕ нужен отдельный PoE2Reader.exe / ExileCore2 / TCP. Рекомендуется.
  # use_memory=ec2 — ExileCore2 TCP bridge (нужен Loader.exe + ключ ExileCore2).
  # use_memory=memory — старый external PROCESS_VM_READ (ломается на патчах).
  # use_memory=false — CV-детект полосы HP моба по цвету (fallback).
  enabled: true
  use_memory: reader          # reader (Recommended) | ec2 | memory | false
  attack_range: 55.0     # радиус атаки в grid-координатах (позиция игрока теперь из Render-компонента; мобы "рядом" = ~120-150 grid)
  # Статичные «призраки»: моб числится живым в памяти (Life-флаг смерти == 0),
  # но НИ РАЗУ не двигался с момента появления — спящие утопленники в воде /
  # декоративные трупы. На MapPort бот держал R1 по невидимому DrownedCrewAxe на
  # 22 grid. Цель = моб, который хоть раз сдвинулся с места (ever_moved) — после
  # этого валиден навсегда, даже если встанет в упор. static_grace_s — сколько
  # секунд новый моб атакуется без движения (чтобы успеть шевельнуться).
  ignore_static_mobs: true
  static_grace_s: 2.0
  button: right_bumper   # R1 (right_bumper | left_bumper | a | b | x | y)
  # зона полосы HP моба (доли кадра). Обычный моб/рара укладывается в 0.36-0.64,
  # но у боссов бар шире (замерено на Графе Жеоноре: 0.323-0.677) — упирался в
  # край ROI и рубился фильтром обрезанных артефактов decorа. Расширено с запасом.
  roi: {x1: 0.22, y1: 0.02, x2: 0.78, y2: 0.12}
  red_sat_min: 150       # порог насыщенности красного полосы (UI-красный насыщеннее камня сцены)
  red_val_min: 90        # порог яркости красного полосы
  # полосу отличаем от красных пятен сцены по ФОРМЕ: длинная, тонкая, сплошная
  # 0.018 (~46px) ловил и красные плашки цифр в оверлее FPS/CPU/GPU/статистики
  # (у пользователя включён, сидит в верхней части экрана) — их ширина гуляет
  # 46-197px под текст, а сам ROI после расширения под боссов их накрывает.
  # Реальные бары мобов начинаются от ~305px (лог: кластеры 305-383 и 898-905),
  # так что подняли планку выше ложных, но с запасом ниже самого узкого бара.
  min_run_frac: 0.10     # мин. ШИРИНА красной компоненты (доля ширины кадра)
  max_h_frac: 0.030      # макс. ВЫСОТА (доля высоты) — полоса тонкая, пятно сцены высокое
  min_aspect: 3.0        # w/h — полоса вытянута по горизонтали (пятно ≈ квадрат)
  min_fill: 0.45         # area/(w*h) — полоса сплошная (текстурный красный сцены — нет)
  # Разбор дампов боя с Doryani's Elite (2026-07-15): при строгом матче fill стабильно
  # 0.48-0.81 — порог не мешает. Но ~10 раз за бой VFX-вспышки боя почти полностью
  # гасили красный (fill падал до 0.002-0.07), и детектор уходил в fallback
  # "добивание"; 3 раза fallback тоже не находил красного в старой рамке дольше
  # low_hp_lock_timeout_s → полный NO MATCH → R1 гарантированно отпускался (лог:
  # разрыв 22:11:31-22:11:34, 2.6с при старом release_grace_s=0.35). Читалось как
  # "полоса видна, а бот не атакует" — R1 рвано отпускался-хватался всю дорогу боя.
  low_hp_lock_timeout_s: 5.0  # было 2.5 — пережить более долгие вспышки VFX
  low_hp_min_px: 6            # было 12 — ловить более тусклый остаток красного под VFX
  # Найдено 2026-07-16 сразу после боя выше: low_hp_lock зависал на 20+ секунд на
  # ПУСТОЙ земле (рыжая листва давала ≥6px красного шума в старой рамке, а окно
  # low_hp_lock_timeout_s скользящее — продлевало само себя бесконечно). Жёсткий
  # потолок с последнего РЕАЛЬНОГО (strict/bootstrap) подтверждения — после него
  # добивание больше не продлевается собственным шумом.
  low_hp_hard_cap_s: 6.0
  release_grace_s: 0.6   # было 0.35 — держать R1 ещё столько после пропажи полосы (сглаживание/добив)
  # Бутстрап под моба, который бот впервые видит УЖЕ подраненным (узкий бар с
  # первого кадра — строгий матч выше никогда не проходит, «добивание» без
  # прежнего строгого матча тоже не сработает). Найдено на Shiverdrool
  # (2026-07-16): полоса ~70px/aspect~1.9 не проходит min_run_frac/min_aspect.
  # Подтверждаем не цветом (декор сцены неотличим по HSV от тёмного фона бара),
  # а устойчивостью: та же рамка держится bootstrap_confirm_s подряд.
  # ВЫКЛЮЧЕНО по умолчанию (2026-07-16): в лавовой/скальной локации в той же
  # сессии поймал 2 разных декора той же формой (aspect 1.62 и 1.94 — ровно как
  # у настоящего Shiverdrool). Устойчивость во времени не спасает от СТАТИЧНОГО
  # декора. Включай осознанно и следи за kind=bootstrap в логе на ложные срабатывания.
  bootstrap_enabled: false
  bootstrap_min_w_frac: 0.02    # мин. ширина под бутстрап (доля кадра, ~51px)
  # "narrow" — узкие бары ПРИ ТОЛПЕ МОБОВ (2026-07-16): много мелких мобов рядом
  # дают много мелких баров вместо одного большого — все ниже min_run_frac.
  # Отличаем от декора не устойчивостью (как bootstrap), а формой: живые замеры
  # реальных баров толпы дали aspect 8.8-11.0, а декор (та же локация, что ловил
  # bootstrap) — 1.6-1.9. Разрыв большой, поэтому включено по умолчанию и без
  # задержки. Риск — только если у тебя включён FPS/HW-оверлей И его плашки
  # такие же вытянутые (на момент ввода оверлей был выключен) — последи за
  # kind=narrow в логе.
  narrow_enabled: true
  narrow_min_w_frac: 0.02
  narrow_min_aspect: 4.0
  # было 1.5 — сразу поймало квадратистую скалу с закатным освещением (aspect 1.62,
  # неподвижна в кадре — устойчивость во времени не спасает от СТАТИЧНОГО декора,
  # только от мелькающих вспышек). У реального Shiverdrool aspect был 1.94 —
  # 2.0 отклонил бы саму цель фикса, поэтому 1.8 (запас в обе стороны от 1.62/1.94).
  bootstrap_min_aspect: 1.8
  bootstrap_confirm_s: 0.25     # держать кандидата на месте столько, прежде чем принять
  bootstrap_move_tol_px: 6      # допуск дрожания рамки между кадрами (тот же кандидат)
  dark_zone:
    # в тёмных зонах (caves) факелы/жаровни дают красные пятна, похожие на бар.
    # Поднимаем min_aspect чтобы отсечь — настоящий бар всегда шире.
    enabled: true
    brightness_thr: 40.0         # средняя яркость ROI ниже этого = тёмная зона
    min_aspect: 5.0              # повышенный порог aspect в тёмных зонах
  zone:
    # в убежище хостильных мобов не бывает — декор (факелы/алтари) иногда
    # проходит фильтр формы полосы и даёт ложную атаку. Категорически глушим
    # авто-атаку, пока на экране виден заголовок панели заданий «Убежище».
    roi: {x1: 0.88, y1: 0.10, x2: 1.0, y2: 0.32}   # зона заголовка панели заданий (доли кадра)
    match_min: 0.85        # порог сходства с шаблоном zone_templates/hideout_label.png
auto_flask:
  # автофляска через чтение памяти (HP/Mana% + кол-во врагов).
  # При use_memory=false используй CV-based фляску (hp.threshold и hp.cooldown_ms).
  # Работает с use_memory=ec2 и use_memory=memory.
  enabled: true
  rules:
    - name: "HP Critical"
      key: left_trigger       # L2 = HP фляга
      hp_below: 0.30          # HP < 30% → жмём
      cooldown_s: 1.0
    - name: "HP Low"
      key: left_trigger
      hp_below: 0.50          # HP < 50% → жмём (реже)
      cooldown_s: 3.0
    - name: "Mana Low"
      key: right_trigger      # R2 = мана фляга
      mana_below: 0.30        # Mana < 30% → жмём
      cooldown_s: 2.0
    - name: "Enemies + Low HP"
      key: left_trigger
      hp_below: 0.70          # HP < 70% + ≥3 врага рядом → жмём
      enemies_nearby: 3
      enemy_radius: 30.0
      cooldown_s: 2.0
exilecore2:
  # Настройки подключения к ExileCore2 ShareData плагину.
  # ShareData — C# плагин, инжектируется ВНУТРЬ PoE2 через Loader.exe,
  # поднимает TCP-сервер и отдаёт JSON с entities/HP/позициями.
  # Установка: см. 0_guest/ в репозитории poe_bot или discord.gg/eMmeSyqEA3
  host: 127.0.0.1       # IP машины с запущенным PoE2+ExileCore2
  port: 50006           # TCP порт ShareData
hotkeys:
  toggle: f8
  diag: f7
  snapshot: f9
  overlay: f6
  attack: f2
  flask: f3
  radial: f4
  quit: f12
radial:
  # Наглядный круг радиуса авто-атаки вокруг персонажа (F4).
  # scale_px_per_grid — сколько пикселей экрана в одном grid по горизонтали
  # (изометрия PoE2: вертикаль сжата вдвое). Калибруется вручную: встань так,
  # чтобы моб был ровно на линии, и подстрой. Смена применится по F5.
  scale_px_per_grid: 20.0
  center_offset_xy: [0, -40]   # персонаж на экране относительно центра окна (px)
