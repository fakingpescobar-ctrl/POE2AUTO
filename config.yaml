game:
  window_title: Path of Exile 2
capture:
  backend: dxcam
vision:
  marker_rgb:
  - 235
  - 0
  - 185
  extra_colors: []
  hue_tolerance: 8
  sat_min: 200
  val_min: 120
  min_blob_area: 200
  close_px: 3
loot:
  pickup_radius_px: 400
  center_offset_xy:
  - 0
  - -40
  cooldown_ms: 100
  pickup_hold_ms: 60
  pickup_button: a
hp:
  enabled: true
  orb:
    cx: 0.0732
    cy: 0.8712
    r: 0.0799
  threshold: 0.88
  cooldown_ms: 333
  flask_button: left_trigger
  flask_hold_ms: 120
  fill_mode: linear
  red_sat_min: 24
  red_val_min: 52
  row_fill_frac: 0.28
  strip_frac: 0.2
  gap_tol_frac: 0.1
  rune_frac: 0.38
  bottom_trim_frac: 0.05
  full_ratio: 0.78
  valid_val: 45
  fallback_red_frac_min: 0.04
  confirm_frames: 1
  tripwire: true
hp_num:
  # Чтение HP из цифр HUD (current/max) — основной источник, орб как fallback.
  # Включается только когда откалиброваны все шаблоны (calibrate_hp_digits.py).
  enabled: true
  auto_locate: true     # на старте сам найти строку HP и орб на экране (портативность
                        # между разрешениями/UI Scale; не нашёл сразу — ищет в фоне)
  roi: {x1: 0.066, y1: 0.700, x2: 0.137, y2: 0.735}   # зона строки «Здоровье» (fallback/стартовая)
  bin_thr: 130          # порог бинаризации (белый текст)
  match_min: 0.55       # мин. совпадение с шаблоном глифа
  min_glyph_h: 10       # мин. высота глифа (px) — отсев шума
  max_hp: 1371          # стартовый max HP (только отсев мусора; дальше подстраивается сам при смене шмота)
  menu_grace_s: 0.5     # цифры нет дольше этого = меню/перекрыт HUD → не пьём (орб подстрахует только в пределах окна)
auto_attack:
  # авто-атака: когда вверху по центру видна полоса HP моба — держим R1.
  enabled: true
  button: right_bumper   # R1 (right_bumper | left_bumper | a | b | x | y)
  # зона полосы HP моба (доли кадра). Обычный моб/рара укладывается в 0.36-0.64,
  # но у боссов бар шире (замерено на Графе Жеоноре: 0.323-0.677) — упирался в
  # край ROI и рубился фильтром обрезанных артефактов decorа. Расширено с запасом.
  roi: {x1: 0.22, y1: 0.02, x2: 0.78, y2: 0.12}
  red_sat_min: 150       # порог насыщенности красного полосы (UI-красный насыщеннее камня сцены)
  red_val_min: 90        # порог яркости красного полосы
  # полосу отличаем от красных пятен сцены по ФОРМЕ: длинная, тонкая, сплошная
  # 0.018 (~46px) ловил и красные плашки цифр в оверлее FPS/CPU/GPU/статистики
  # (у пользователя включён, сидит в верхней части экрана) — их ширина гуляет
  # 46-197px под текст, а сам ROI после расширения под боссов их накрывает.
  # Реальные бары мобов начинаются от ~305px (лог: кластеры 305-383 и 898-905),
  # так что подняли планку выше ложных, но с запасом ниже самого узкого бара.
  min_run_frac: 0.10     # мин. ШИРИНА красной компоненты (доля ширины кадра)
  max_h_frac: 0.030      # макс. ВЫСОТА (доля высоты) — полоса тонкая, пятно сцены высокое
  min_aspect: 3.0        # w/h — полоса вытянута по горизонтали (пятно ≈ квадрат)
  min_fill: 0.45         # area/(w*h) — полоса сплошная (текстурный красный сцены — нет)
  # Разбор дампов боя с Doryani's Elite (2026-07-15): при строгом матче fill стабильно
  # 0.48-0.81 — порог не мешает. Но ~10 раз за бой VFX-вспышки боя почти полностью
  # гасили красный (fill падал до 0.002-0.07), и детектор уходил в fallback
  # "добивание"; 3 раза fallback тоже не находил красного в старой рамке дольше
  # low_hp_lock_timeout_s → полный NO MATCH → R1 гарантированно отпускался (лог:
  # разрыв 22:11:31-22:11:34, 2.6с при старом release_grace_s=0.35). Читалось как
  # "полоса видна, а бот не атакует" — R1 рвано отпускался-хватался всю дорогу боя.
  low_hp_lock_timeout_s: 5.0  # было 2.5 — пережить более долгие вспышки VFX
  low_hp_min_px: 6            # было 12 — ловить более тусклый остаток красного под VFX
  # Найдено 2026-07-16 сразу после боя выше: low_hp_lock зависал на 20+ секунд на
  # ПУСТОЙ земле (рыжая листва давала ≥6px красного шума в старой рамке, а окно
  # low_hp_lock_timeout_s скользящее — продлевало само себя бесконечно). Жёсткий
  # потолок с последнего РЕАЛЬНОГО (strict/bootstrap) подтверждения — после него
  # добивание больше не продлевается собственным шумом.
  low_hp_hard_cap_s: 6.0
  release_grace_s: 0.6   # было 0.35 — держать R1 ещё столько после пропажи полосы (сглаживание/добив)
  # Бутстрап под моба, который бот впервые видит УЖЕ подраненным (узкий бар с
  # первого кадра — строгий матч выше никогда не проходит, «добивание» без
  # прежнего строгого матча тоже не сработает). Найдено на Shiverdrool
  # (2026-07-16): полоса ~70px/aspect~1.9 не проходит min_run_frac/min_aspect.
  # Подтверждаем не цветом (декор сцены неотличим по HSV от тёмного фона бара),
  # а устойчивостью: та же рамка держится bootstrap_confirm_s подряд.
  bootstrap_min_w_frac: 0.02    # мин. ширина под бутстрап (доля кадра, ~51px)
  bootstrap_min_aspect: 1.5     # мягче строгих 3.0, но выше «квадратного» декора (~1)
  bootstrap_confirm_s: 0.25     # держать кандидата на месте столько, прежде чем принять
  bootstrap_move_tol_px: 6      # допуск дрожания рамки между кадрами (тот же кандидат)
  zone:
    # в убежище хостильных мобов не бывает — декор (факелы/алтари) иногда
    # проходит фильтр формы полосы и даёт ложную атаку. Категорически глушим
    # авто-атаку, пока на экране виден заголовок панели заданий «Убежище».
    roi: {x1: 0.90, y1: 0.24, x2: 1.0, y2: 0.32}   # зона заголовка панели заданий (доли кадра)
    match_min: 0.85        # порог сходства с шаблоном zone_templates/hideout_label.png
hotkeys:
  toggle: f8
  diag: f7
  snapshot: f9
  overlay: f6
  attack: f2
  flask: f3
  quit: f12
